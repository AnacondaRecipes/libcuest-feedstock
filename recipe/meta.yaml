{% set name = "libcuest" %}
{% set version = "0.2.2.2" %}

{% set abiversion = version.split('.')[0] %}
{% set majorminorpatch = '.'.join(version.split('.')[:3]) %}
{% set platform = "linux-x86_64" %}  # [linux64]
{% set platform = "linux-sbsa" %}  # [aarch64]
{% set target_name = "x86_64-linux" %}  # [linux64]
{% set target_name = "sbsa-linux" %}  # [aarch64]
{% set extension = "tar.xz" %}  # [not win]

# Anaconda: split version parts for header macro checks
{% set ver_major = version.split('.')[0] %}
{% set ver_minor = version.split('.')[1] %}
{% set ver_patch = version.split('.')[2] %}

package:
  name: {{ name|lower }}-split
  version: {{ version }}

source:
  - url: https://developer.download.nvidia.com/compute/cuest/redist/{{ name }}/{{ platform }}/{{ name }}-{{ platform }}-{{ version }}_cuda12-archive.{{ extension }}  # [linux64 and (cuda_compiler_version or "").startswith("12")]
    sha256: 03417f0a2dfa4ef436a2ea30800a44856b1ab3b8b46fac92cbec2e1c8b4fda10  # [linux64 and (cuda_compiler_version or "").startswith("12")]
  - url: https://developer.download.nvidia.com/compute/cuest/redist/{{ name }}/{{ platform }}/{{ name }}-{{ platform }}-{{ version }}_cuda13-archive.{{ extension }}  # [linux64 and (cuda_compiler_version or "").startswith("13")]
    sha256: 71641ba4aaa068dad037b9837f6fd0920edb7283f8297eccb9bedba6f405d228  # [linux64 and (cuda_compiler_version or "").startswith("13")]
  - url: https://developer.download.nvidia.com/compute/cuest/redist/{{ name }}/{{ platform }}/{{ name }}-{{ platform }}-{{ version }}_cuda12-archive.{{ extension }}  # [aarch64 and (cuda_compiler_version or "").startswith("12")]
    sha256: b5a19206e49b7df30080260123649063f8d9e730458634d764fe87f6f02466a6  # [aarch64 and (cuda_compiler_version or "").startswith("12")]
  - url: https://developer.download.nvidia.com/compute/cuest/redist/{{ name }}/{{ platform }}/{{ name }}-{{ platform }}-{{ version }}_cuda13-archive.{{ extension }}  # [aarch64 and (cuda_compiler_version or "").startswith("13")]
    sha256: 413e9050d2c1e998a0a6eb803e1c468217fbeebe25e5e80068c22b5ce8e66c31  # [aarch64 and (cuda_compiler_version or "").startswith("13")]

build:
  number: 0
  skip: true  # [not (linux64 or aarch64) or cuda_compiler_version in ("None", "")]

requirements:
  build:
    - cf-nvidia-tools 1.*  # [linux]

outputs:
  - name: libcuest
    build:
      missing_dso_whitelist:
        - "*libcuda.so*"              # driver, not provided by any conda package
      # Ignore run_exports on cuda-version which we need to add to avoid hash collision as we have multiple CTK support
      ignore_run_exports:
        - cuda-version
      # cuda-version will take care of constraining versions for the following
      # and thus we should ignore the run exports from them which are more strict
      ignore_run_exports_from:
        - cuda-nvrtc-dev
        - libcublas-dev
        - libcusolver-dev
        - libcusparse-dev
        - libnvjitlink-dev
    files:
      - lib/libcuest*.so.*
    requirements:
      build:
        - {{ compiler("c") }}
        - {{ compiler("cxx") }}
        - {{ stdlib("c") }}
        - {{ compiler('cuda') }}
      host:
        - cuda-nvrtc-dev
        - libcublas-dev
        - libcusolver-dev
        - libcusparse-dev
        - libnvjitlink-dev
        - cuda-version {{ cuda_compiler_version }}
      run:
        - libcublas
        - libcusolver
        - libcusparse
        - cuda-nvrtc
        - libnvjitlink
        - {{ pin_compatible('cuda-version', max_pin='x', min_pin='x') }}
    test:
      commands:
        # Anaconda: runtime ships only versioned libraries, not dev/static files
        - test -f $PREFIX/lib/libcuest.so.{{ majorminorpatch }}
        - test -L $PREFIX/lib/libcuest.so.{{ abiversion }}
        - test ! -f $PREFIX/lib/libcuest.so
        - test ! -f $PREFIX/lib/libcuest_static.a

  - name: libcuest-dev
    build:
      ignore_run_exports:
        - cuda-version
      # Export libcuest for a consuming feedstock that needs libcuest-dev in their host: section
      # For this lib, the breaking changes occur at the minor version (until major version reaches 1)
      run_exports:
        - {{ pin_subpackage("libcuest", max_pin="x.x") }}
    files:
      - lib/libcuest*.so
      - include/
    requirements:
      build:
        - {{ compiler("c") }}
        - {{ compiler("cxx") }}
        - {{ stdlib("c") }}
        - {{ compiler('cuda') }}
      host:
        - cuda-version {{ cuda_compiler_version }}
        - {{ pin_subpackage("libcuest", exact=True) }}
      run:
        - {{ pin_compatible("cuda-version", min_pin="x", max_pin="x") }}
        - {{ pin_subpackage("libcuest", exact=True) }}
    test:
      files:
        - test/test_cuest.c
      requires:
        - {{ compiler('c') }}
        - {{ stdlib('c') }}
      commands:
        # Anaconda: verify the unversioned link and all public header directories are shipped
        - test -L $PREFIX/lib/libcuest.so
        - test -f $PREFIX/include/cuest.h
        - test ! -f $PREFIX/lib/libcuest_static.a
        - for d in basis context density_fitted_integrals ecp ecp_basis exchange_correlation grid integral_plans one_electron_integrals parameters pcm query results types; do test -d $PREFIX/include/cuest/$d; done
        # Anaconda: verify the header version macros match the package version
        - grep -Eq '#define +CUEST_VER_MAJOR +{{ ver_major }}' $PREFIX/include/cuest.h
        - grep -Eq '#define +CUEST_VER_MINOR +{{ ver_minor }}' $PREFIX/include/cuest.h
        - grep -Eq '#define +CUEST_VER_PATCH +{{ ver_patch }}' $PREFIX/include/cuest.h
        # Anaconda: compile and link a minimal consumer to validate the dev package
        - $CC test/test_cuest.c -I$PREFIX/include -L$PREFIX/lib -lcuest -o test_cuest

  - name: libcuest-static
    build:
      ignore_run_exports:
        - cuda-version
    files:
      - lib/libcuest_static.a
    requirements:
      build:
        - {{ compiler("c") }}
        - {{ compiler("cxx") }}
        - {{ stdlib("c") }}
        - {{ compiler('cuda') }}
      host:
        - cuda-version {{ cuda_compiler_version }}
        - {{ pin_subpackage("libcuest-dev", exact=True) }}
      run:
        - {{ pin_compatible("cuda-version", min_pin="x", max_pin="x") }}
        - {{ pin_subpackage("libcuest-dev", exact=True) }}
    test:
      commands:
        # Anaconda: ensure the static archive is present and non-empty
        - test -s $PREFIX/lib/libcuest_static.a

about:
  home: https://developer.nvidia.com/cuest
  license: LicenseRef-NVIDIA-End-User-License-Agreement
  license_family: Other
  license_file: LICENSE
  license_url: https://docs.nvidia.com/cuda/cuest/latest/license.html
  summary: cuEST - GPU-powered electronic structure theory
  description: |
    Fast, GPU-powered components for electronic structure theory
  doc_url: https://docs.nvidia.com/cuda/cuest/
  dev_url: https://developer.nvidia.com/cuest

extra:
  skip-lints:
    - deprecate_license_url
  feedstock-name: libcuest
  recipe-maintainers:
    - conda-forge/cuda
